<svg viewBox="0 0 2000 740" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="2000" height="740" fill="#ffffff"/>

  <!-- Title -->
  <text x="150" y="80" fill="#1a1a1a" font-size="26" font-weight="bold">Where 7,298 ms of GPU time went</text>
  <text x="150" y="112" fill="#5a5a62" font-size="15">torch profiler &#183; 9 steps @ 832&#215;1216 &#183; L4 locked at 1830 MHz &#183; 15,952 GPU events &#183; 100% attribution</text>

  <!-- ============ TOP CALLOUTS (above the bar) ============ -->
  <!-- nf4 dequant surprise callout -->
  <text x="1300" y="175" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">The expected bottleneck.</text>
  <text x="1300" y="197" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">Measured: 3.1%.</text>
  <text x="1300" y="219" fill="#8e6fd8" font-size="14" text-anchor="middle" font-weight="bold">nf4 dequant &#8212; 3.1%</text>
  <line x1="1370" y1="228" x2="1600" y2="270" stroke="#8e6fd8" stroke-width="1.5"/>
  <line x1="1600" y1="270" x2="1822" y2="308" stroke="#8e6fd8" stroke-width="1.5"/>

  <!-- idle callout -->
  <text x="1935" y="185" fill="#5a5a62" font-size="15" text-anchor="end">0.5% idle</text>
  <text x="1935" y="204" fill="#5a5a62" font-size="15" text-anchor="end">CUDA graph capture ruled out</text>
  <line x1="1935" y1="215" x2="1935" y2="260" stroke="#555555" stroke-width="1.5"/>
  <line x1="1935" y1="260" x2="1852.5" y2="308" stroke="#555555" stroke-width="1.5"/>

  <!-- ============ THE BAR ============ -->
  <!-- y=320, height=110, total width 1700 starting x=150 -->
  <!-- GEMM 41.2% : x=150 w=700.4 -->
  <rect x="150" y="320" width="700.4" height="110" fill="#5b8def"/>
  <!-- Attention 20.3% : x=850.4 w=345.1 -->
  <rect x="850.4" y="320" width="345.1" height="110" fill="#e0a83c"/>
  <!-- Elementwise + norm 35.3% : x=1195.5 w=600.1 -->
  <rect x="1195.5" y="320" width="600.1" height="110" fill="#d9453a"/>
  <!-- nf4 dequant 3.1% : x=1795.6 w=52.7 -->
  <rect x="1795.6" y="320" width="52.7" height="110" fill="#8e6fd8"/>
  <!-- idle 0.5% : x=1848.3 w=8.5 -->
  <rect x="1848.3" y="320" width="8.5" height="110" fill="#555555"/>

  <!-- bar segment outlines for legibility at small widths -->
  <rect x="150" y="320" width="1706.8" height="110" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- in-bar labels -->
  <text x="500.2" y="368" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">GEMM</text>
  <text x="500.2" y="392" fill="#ffffff" font-size="15" text-anchor="middle">41.2%</text>

  <text x="1022.9" y="368" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Attention</text>
  <text x="1022.9" y="392" fill="#ffffff" font-size="15" text-anchor="middle">20.3%</text>

  <text x="1495.6" y="368" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Elementwise + norm</text>
  <text x="1495.6" y="392" fill="#ffffff" font-size="15" text-anchor="middle">35.3%</text>


  <!-- ============ BOTTOM CALLOUTS ============ -->

  <!-- GEMM + Attention grouped note -->
  <line x1="500.2" y1="430" x2="500.2" y2="470" stroke="#5b8def" stroke-width="1.5"/>
  <line x1="1022.9" y1="430" x2="1022.9" y2="470" stroke="#e0a83c" stroke-width="1.5"/>
  <line x1="500.2" y1="470" x2="1022.9" y2="470" stroke="#6a6a70" stroke-width="1.5"/>
  <text x="761.5" y="500" fill="#5a5a62" font-size="16" text-anchor="middle">Already on tensor cores (CUTLASS sm89, fmha_cutlassF).</text>
  <text x="761.5" y="522" fill="#5a5a62" font-size="16" text-anchor="middle">Not the target.</text>

  <!-- Elementwise + norm emphasized note -->
  <line x1="1495.6" y1="430" x2="1495.6" y2="470" stroke="#d9453a" stroke-width="1.5"/>
  <text x="1495.6" y="500" fill="#1a1a1a" font-size="19" font-weight="bold" text-anchor="middle">The target.</text>
  <line x1="1450" y1="510" x2="1541" y2="510" stroke="#d9453a" stroke-width="3"/>

  <text x="1495.6" y="542" fill="#5a5a62" font-size="15" text-anchor="middle">copy_ (pure dtype conversion): 2,264 launches, 739 ms &#8212; ~10% of all GPU time</text>
  <text x="1495.6" y="566" fill="#5a5a62" font-size="15" text-anchor="middle">pow_tensor_scalar: 442 ms &#8212; RMSNorm was never fused (pow/mean/rsqrt: 820 launches each)</text>
  <text x="1495.6" y="590" fill="#5a5a62" font-size="15" text-anchor="middle">mul: 2,580 launches, 844 ms</text>

  <!-- ============ BOTTOM LINE ============ -->
  <text x="1000" y="672" fill="#5a5a62" font-size="16" font-style="italic" text-anchor="middle">Step time flat across all 9 steps (min 1.681 s, max 1.796 s) &#8212; the loop is uniform, so the optimization is uniform.</text>

</svg>
